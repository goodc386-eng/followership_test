<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>팔로워십 진단 PRO v2.8</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; background-color: #f8fafc; }
        .hidden { display: none !important; }
        .animate-fade-in { animation: fadeIn 0.5s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .option-btn { border: 2px solid #f1f5f9; padding: 12px; border-radius: 16px; transition: all 0.2s; cursor: pointer; text-align: center; background: white; }
        .option-btn:hover { border-color: #3b82f6; background-color: #eff6ff; transform: translateY(-2px); }
        .option-btn:active { transform: scale(0.95); }
    </style>
</head>
<body class="p-4 flex items-center justify-center min-h-screen">

    <div id="app-container" class="max-w-2xl w-full bg-white rounded-3xl shadow-2xl overflow-hidden animate-fade-in">
        <div class="bg-slate-900 text-white p-6 flex items-center justify-between">
            <h1 class="text-xl font-bold tracking-tight">Followership Assessment</h1>
            <div id="quiz-progress-text" class="hidden text-sm font-medium text-slate-400"></div>
        </div>

        <div id="main-content" class="p-8">
            <div id="welcome-screen" class="text-center space-y-8 py-10">
                <div class="space-y-4">
                    <h2 class="text-4xl font-black text-slate-900">팔로워십 유형 진단</h2>
                    <p class="text-slate-500 text-sm">로버트 켈리 모델을 기반으로 당신의 업무 스타일을 분석합니다.</p>
                </div>
                <div class="max-w-xs mx-auto">
                    <input type="text" id="user-name" placeholder="성함을 입력하세요" class="w-full p-4 border-2 border-slate-100 rounded-2xl outline-none text-center text-lg font-bold focus:border-blue-500">
                </div>
                <button onclick="startQuiz()" class="w-full sm:w-auto bg-blue-600 text-white font-bold py-4 px-12 rounded-2xl shadow-lg hover:bg-blue-700 transition-all">
                    진단 시작하기
                </button>
            </div>

            <div id="quiz-screen" class="hidden space-y-8">
                <div class="h-2 w-full bg-slate-100 rounded-full overflow-hidden">
                    <div id="progress-bar" class="h-full bg-blue-500 transition-all duration-300"></div>
                </div>
                <div class="text-center">
                    <span id="question-number" class="text-blue-500 font-bold text-lg"></span>
                    <h3 id="question-text" class="text-xl font-bold text-slate-900 mt-2 leading-relaxed"></h3>
                </div>
                <div id="options-container" class="grid grid-cols-7 gap-2"></div>
                <button id="prev-btn" onclick="prevQuestion()" class="text-slate-400 font-medium hover:text-slate-600 flex items-center gap-2">
                    ← 이전 문항
                </button>
            </div>

            <div id="result-screen" class="hidden space-y-8 animate-fade-in text-center">
                <div class="space-y-2">
                    <h3 id="result-name" class="text-4xl font-black text-slate-900"></h3>
                    <p id="result-desc" class="text-xl font-bold text-blue-600"></p>
                </div>
                <div class="bg-slate-50 p-6 rounded-3xl text-left space-y-4">
                    <div><h4 class="text-xs font-bold text-slate-400 uppercase tracking-widest">상세 분석</h4><p id="result-details" class="text-slate-700 mt-1"></p></div>
                    <div class="pt-4 border-t border-slate-200"><h4 class="text-xs font-bold text-green-500 uppercase tracking-widest">성장 제언</h4><p id="result-advice" class="text-slate-700 mt-1 font-medium"></p></div>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div class="bg-blue-50 p-4 rounded-2xl"><div id="score-y" class="text-2xl font-black"></div><div class="text-[10px] text-blue-400 font-bold">독립적 사고</div></div>
                    <div class="bg-blue-50 p-4 rounded-2xl"><div id="score-x" class="text-2xl font-black"></div><div class="text-[10px] text-blue-400 font-bold">적극적 참여</div></div>
                </div>
                <button onclick="location.reload()" class="w-full bg-slate-100 py-4 rounded-2xl font-bold text-slate-600">다시 진단하기</button>
            </div>
        </div>
    </div>

    <script>
        const questions = [
            { id: 1, category: 'Y', text: "당신의 일은 자신에게 중요한 사회적 목표나 꿈을 성취하는데 도움이 되는가?" },
            { id: 2, category: 'X', text: "당신은 개인의 목표가 조직의 목표와 조화되어야 한다고 생각하는가?" },
            { id: 3, category: 'X', text: "당신은 최선의 아이디어와 능력을 조직에 쏟아 부으며 열정적으로 일하는가?" },
            { id: 4, category: 'X', text: "당신의 열의가 확산되어 주변 동료들을 활기차게 만드는가?" },
            { id: 5, category: 'Y', text: "지시를 기다리기보다 무엇이 가장 중요한 활동인지 직접 판단하는가?" },
            { id: 6, category: 'X', text: "조직에 가치 있는 사람이 되기 위해 자신의 독특한 능력을 적극 발휘하는가?" },
            { id: 7, category: 'X', text: "새 업무가 시작되었을 때 리더가 원하는 분야에서 곧바로 성과를 내는가?" },
            { id: 8, category: 'X', text: "리더가 당신을 신뢰하여 어려운 임무를 기한 안에 맡기는가?" },
            { id: 9, category: 'X', text: "임무 범위를 벗어나는 일도 조직을 위해 솔선수범하여 완수하는가?" },
            { id: 10, category: 'X', text: "리더가 아닐 때도 맡은 일 이상의 공헌을 하며 팀에 기여하는가?" },
            { id: 11, category: 'Y', text: "조직 목표에 공헌할 수 있는 새로운 아이디어를 독자적으로 제안하는가?" },
            { id: 12, category: 'Y', text: "어려운 문제를 리더에게 의존하기보다 스스로 해결책을 찾으려 하는가?" },
            { id: 13, category: 'X', text: "자신이 인정을 받지 못하더라도 동료들이 좋은 평가를 받도록 돕는가?" },
            { id: 14, category: 'Y', text: "필요한 경우 반대 의견을 내서라도 조직이 위험을 보게 돕는가?" },
            { id: 15, category: 'X', text: "리더의 요구나 제약을 이해하고 이를 충족시키기 위해 최선을 다하는가?" },
            { id: 16, category: 'Y', text: "자신의 장점과 약점을 솔직하게 인정하고 보완하려 노력하는가?" },
            { id: 17, category: 'Y', text: "요구받은 일만 하기보다 리더의 판단이 현명한지 스스로 평가해보는가?" },
            { id: 18, category: 'Y', text: "리더가 본인의 전문성에 반하는 일을 부탁할 때 '아니오'라고 말할 수 있는가?" },
            { id: 19, category: 'Y', text: "조직의 기준이 아니라 자신의 윤리적 기준에 따라 소신껏 행동하는가?" },
            { id: 20, category: 'Y', text: "조직과 갈등할 위험이 있더라도 중요한 이슈에 대해 견해를 주장하는가?" }
        ];

        let currentIdx = 0;
        let answers = {};
        let userName = "";
        
        // 상우님의 Apps Script URL 적용됨
        const scriptURL = 'https://script.google.com/macros/s/AKfycbzgTg3NbvTwk6-yrDODI7-25rmtI4iNgZeS2x6QcxCdgvyWivVN-iskKB35zinbvkscRQ/exec'; 

        function startQuiz() {
            const input = document.getElementById('user-name');
            userName = input ? input.value.trim() : "";
            if(!userName) { alert("성함을 입력해주세요."); return; }
            
            document.getElementById('welcome-screen').classList.add('hidden');
            document.getElementById('quiz-screen').classList.remove('hidden');
            document.getElementById('quiz-progress-text').classList.remove('hidden');
            updateQuestion();
        }

        function updateQuestion() {
            const q = questions[currentIdx];
            document.getElementById('question-number').innerText = `Q${currentIdx + 1}.`;
            document.getElementById('question-text').innerText = q.text;
            document.getElementById('quiz-progress-text').innerText = `${currentIdx + 1} / ${questions.length}`;
            document.getElementById('progress-bar').style.width = `${((currentIdx + 1) / questions.length) * 100}%`;
            
            const btnPrev = document.getElementById('prev-btn');
            if(currentIdx > 0) btnPrev.classList.remove('hidden'); else btnPrev.classList.add('hidden');

            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = [0, 1, 2, 3, 4, 5, 6].map(num => `
                <div onclick="handleAnswer(${num})" class="option-btn">
                    <span class="text-[10px] text-slate-400">${num===0?'드묾':num===3?'보통':num===6?'항상':'.'}</span>
                    <div class="font-bold text-lg">${num}</div>
                </div>
            `).join('');
        }

        function handleAnswer(val) {
            answers[questions[currentIdx].id] = val;
            if (currentIdx < questions.length - 1) {
                currentIdx++;
                updateQuestion();
            } else {
                calculateResult();
            }
        }

        function prevQuestion() { if (currentIdx > 0) { currentIdx--; updateQuestion(); } }

        function calculateResult() {
            let xTotal = 0, yTotal = 0;
            Object.keys(answers).forEach(id => {
                const q = questions.find(item => item.id === parseInt(id));
                if (q.category === 'X') xTotal += answers[id]; else yTotal += answers[id];
            });

            let finalType;
            if (yTotal >= 36 && xTotal >= 36) finalType = { name: "모범형", desc: "독립적이며 열정적인 파트너", details: "비판적 사고와 참여가 모두 높으며, 조직의 핵심 엔진 역할을 수행합니다.", advice: "리더와의 파트너십을 넘어 후배 멘토링에 힘써보세요." };
            else if (yTotal >= 36 && xTotal < 36) finalType = { name: "소외형", desc: "비판적이지만 냉소적인 방관자", details: "사고력은 뛰어나지만 참여도가 낮아 냉소주의에 빠질 위험이 있습니다.", advice: "비판을 넘어 실제적인 해결 대안을 제시해 보세요." };
            else if (yTotal < 36 && xTotal >= 36) finalType = { name: "순응형", desc: "충성스럽지만 주관 없는 예스맨", details: "참여도는 높으나 리더의 결정에 무조건 따르는 경향이 있습니다.", advice: "본인만의 논리적인 반대 의견을 내는 훈련을 해보세요." };
            else if (yTotal >= 24 && xTotal >= 24) finalType = { name: "실무형", desc: "상황에 따라 대처하는 생존가", details: "조직 내 정치적 상황에 민감하며 대세를 따르는 경향이 있습니다.", advice: "안전함을 넘어 본인의 신념을 적극적으로 주장해 보세요." };
            else finalType = { name: "수동형", desc: "지시만 기다리는 수동적 팔로워", details: "사고와 참여 모두가 낮으며 의욕이 저하된 상태일 수 있습니다.", advice: "작은 성공 경험을 통해 자기 효능감을 회복해 보세요." };

            document.getElementById('quiz-screen').classList.add('hidden');
            document.getElementById('quiz-progress-text').classList.add('hidden');
            document.getElementById('result-screen').classList.remove('hidden');
            
            document.getElementById('result-name').innerText = finalType.name;
            document.getElementById('result-desc').innerText = finalType.desc;
            document.getElementById('result-details').innerText = finalType.details;
            document.getElementById('result-advice').innerText = finalType.advice;
            document.getElementById('score-x').innerText = xTotal;
            document.getElementById('score-y').innerText = yTotal;

            // 데이터 전송
            fetch(scriptURL, {
                method: 'POST',
                mode: 'no-cors',
                body: JSON.stringify({ userName, scoreX: xTotal, scoreY: yTotal, type: finalType.name })
            });
        }
    </script>
</body>
</html>
